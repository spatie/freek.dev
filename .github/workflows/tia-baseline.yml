name: Record TIA baseline

on:
    push:
        branches:
            - main

jobs:
    record-tia-baseline:
        name: Record TIA baseline
        runs-on: ubuntu-latest
        timeout-minutes: 15
        services:
            redis:
                image: redis
                ports:
                    - 6379:6379
                options: --entrypoint redis-server
        steps:
            -   uses: actions/checkout@v6

            -   name: Setup PHP
                uses: shivammathur/setup-php@v2
                with:
                    php-version: '8.5'
                    extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick
                    coverage: pcov

            -   name: create db
                run: |
                    sudo /etc/init.d/mysql start
                    mysql  -u root -proot -e 'CREATE DATABASE IF NOT EXISTS freekdev_test;'

            -   name: Run composer install
                run: composer install -n --prefer-dist
                env:
                    COMPOSER_AUTH: ${{ secrets.COMPOSER_AUTH }}

            -   name: Cache yarn dependencies
                uses: actions/cache@v4
                with:
                    path: node_modules
                    key: yarn-${{ hashFiles('yarn.lock') }}

            -   name: Run yarn
                run: yarn && yarn build

            -   name: Prepare Laravel Application
                run: |
                    cp .env.example .env
                    php artisan key:generate

            -   name: Record baseline
                run: |
                    ./vendor/bin/pest --tia --fresh
                    echo "TIA_DIR=$(./vendor/bin/pest --tia --baseline)" >> "$GITHUB_ENV"
                env:
                    DB_PASSWORD: root
                    REDIS_PORT: ${{ job.services.redis.ports[6379] }}

            -   name: Publish baseline
                uses: actions/upload-artifact@v4
                with:
                    name: pest-tia-baseline
                    path: ${{ env.TIA_DIR }}
                    retention-days: 30
